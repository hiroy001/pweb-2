<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        let pilhaPessoas = [];

        pilhaPessoas.push( { nome: "Joao", contato: "9999-9999"});
         pilhaPessoas.push( { nome: "maria", contato: "8888-8888"})

        function limpaCampos() {
            document.getElementById('nome').value = '';
            document.getElementById('contato').value = '';
        }

        function adicionar() {
            // pega os valores digitados nos inputs
            const nome = document.getElementById('nome').value;
            const contato = document.getElementById('contato').value;

            pilhaPessoas.push({ nome, contato });

            // limpa os campos e atualiza a lista
            limpaCampos();
            mostrarLista();
        }

        function mostrarLista(){
            const container = document.getElementById('minhaDiv');
            container.innerHTML = '';

            for (let i = 0; i < pilhaPessoas.length;  i++) {
               const pessoa = pilhaPessoas[i];
               const tag = '- Nome: ' + pessoa.nome + ' | Contato: ' + pessoa.contato + '  </h5>';
                container.innerHTML += tag;
            }
        }

        function posicao() {
            const indice = Number(prompt('Qual posição da lista deseja consultar?'));

            if (indice < 0 || indice >= pilhaPessoas.length) {
                alert('Posição inválida!');
                return;
            }

            const pessoa = pilhaPessoas[indice];
            alert('Na posição ' + indice + 'está: Nome: ' + pessoa.nome + ' - Contato' + pessoa.contato)
        }

        function remover() {
            if (pilhaPessoas.length == 0){
                alert('A pilha esta vazia!');
            } else{
                const removido = pilhaPessoas.pop();
                alert('Removido: ' + removido.nome + ' - ' + removido.contato);
                mostrarLista();
            }
        }

        window.onload = function() {
            mostrarLista()
        };
        
    </script>
</head>
<body>

    <label>Nome:</label>
    <input type="text" id="nome" placeholder="Digite o nome">

    <label>Contato:</label>
    <input type="text" id="contato" placeholder="Digite o contato">

    <button onclick="adicionar()">Adicionar</button>
    <button onclick="posicao()">Consultar posição</button>
    <button onclick="remover()">Remover (pop)</button>

    <br><br>
    <hr>

    <div id="minhaDiv"></div>

</body>
</html>
