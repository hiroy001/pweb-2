<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script2</title>

    <script>
        function raizquadrada(num) {
            alert("A raiz de " + num + " é: " + Math.sqrt(num));
        }
        function escreveDiv(texto) {
            document.getElementById("minhaDiv").innerHTML = texto;
        }
        function escreveDiv2() {
            texto = prompt('Digite um texto qualquer');
            document.getElementById("minhaDiv2").innerHTML = texto;
        }
        function loopN(n) {
            n = (Number)(n);
            html = "";
            for (let index = 0; index < n; index++) {
                html += index + 1
                if (index < n) {
                    html += "<br>";
                }
            }
            document.getElementById("Desafio").innerHTML = html;
        }
        function raiz(n) {
            n = (Number)(n)
            if (n == 0) {
                document.getElementById("RaizResultado").innerHTML = "Não existe raiz de 0";
            } else if (n < 0) {
                document.getElementById("RaizResultado").innerHTML = "Não existe raiz de números negativos";
            } else {
                document.getElementById("RaizResultado").innerHTML = Math.sqrt(n);
            }
        }
        function escreverNumerosInput() {
            var input = document.getElementById("numeroInput");
            var n = parseInt(input.value);
            if (isNaN(n) || n <= 0) {
                alert("Por favor, insira um número válido maior que zero.");
                return;
            }
            var div = document.getElementById("numerosInput");
            div.innerHTML = "";
            for (var i = 1; i <= n; i++) {
                div.innerHTML += i + "<br>";
            }
        }
    </script>
</head>

<body>
    <h1>Raiz Quadrada</h1>
    <p><button onclick="raizquadrada(25)">Raiz de 25</button>
    <p>
    <p><button onclick="raizquadrada(36)">Raiz de 36</button>
    <p>
    <p><button onclick="raizquadrada(49)">Raiz de 49</button></P>
    <hr>
    <h1>Escreve Div</h1>
    <button onclick="escreveDiv('<h1> Programação Web')">Escrever</button>
    <p>
    <div id="minhaDiv"></div>
    </p>
    <hr>
    <h1>Escrevendo na Texto Diâmico</h1>
    <button onclick="escreveDiv2()">Escrever</button> <br><br>
    <div id="minhaDiv2"></div>
    <hr>
    <h1>Desafio</h1>
    <input id="DesafioInput"></input><br>
    <button onclick="loopN(document.getElementById('DesafioInput').value)">Carregar</button><br><br>
    <div id="Desafio"></div>
    <hr>
    <h1>Desafio: Raiz Quadrada de N</h1>
    <p>Digite o valor de N: <input id="RaizInput"> <button
            onclick="raiz(document.getElementById('RaizInput').value)">Calcular</button></p>
    <div id="RaizResultado"></div>
    <hr>
    <h1>Desafio input</h1>
    <label for="numeroInput">Digite um valor de N</label>
    <input type="number" id="numeroInput" placeholder="Digite um número" min="1">
    <button onclick="escreverNumerosInput()"> Escrever Números </button>
    <br><br>
    <div id="numerosInput"></div>

</body>

</html>
