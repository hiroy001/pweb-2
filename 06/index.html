<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <title>Lista de Pessoas</title>
</head>
<body>
    <div id="minhaDiv">
      <table class="table table-bordered table-striped align-middle shadow-sm">
        <thead class="table-dark">
            <tr>
                <th scope="col">#</th>
                <th scope="col">Nome</th>
                <th scope="col">Contato</th>
                <th scope="col">Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaCorpo">
            <!-- Linhas serão inseridas aqui -->
        </tbody>
      </table>    
    </div>

    <div class="card p-4 shadow-sm">
        <div class="row g-3">
            <div class="col-md-5">
                <label class="form-label">Nome</label>
                <input type="text" id="nome" class="form-control" placeholder="Digite o nome">
            </div>
            <div class="col-md-5">
                <label class="form-label">Contato</label>
                <input type="text" id="contato" class="form-control" placeholder="Digite o contato">
            </div>

            <div class="mt-3 d-flex gap-2">
                <button class="btn btn-secondary" onclick="salvar()">Salvar</button>
            </div>
    </div>
    
    





</body>
</html>
