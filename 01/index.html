<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script</title>
    <script>
        function alerta(arg, arg2) {
            alert('A soma vai ser:' + arg + arg2);
        }

        function escreve(msg) {
            document.write(msg)
        }
    </script>
</head>

<body>
    <h1> Java Script </h1>
    <button onclick="alerta(20 + 50)">ALERTA</button>
    <button onclick="escreve('Escrita')">ESCREVER</button>
</body>

</html>
