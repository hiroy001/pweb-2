<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let linguagens = Array();

        linguagens[0] = 'Dart';
        linguagens[1] = 'PHP';
        linguagens[2] = 'Java';
        linguagens[3] = 'Python';
        linguagens[4] = 'Perl';
        linguagens[5] = 'Ruby on Rains';
        linguagens[6] = 'C ++';

        function mostrarListaLinguagens() {

            const container = document.getElementById('minhaDiv')
            for (var i = 0; i < linguagens.length; i++) {
                var tag = '<h5>' + i + ' - ' + linguagens[i] + '</h5>';
                container.innerHTML += tag
            }


        }



    </script>
</head>

<body>
    <h1>Arrays de Linguagens</h1>

    <button onclick="mostrarListaLinguagens()">criar Array</button> <br><br>

    <div id="minhaDiv"></div>


</body>

</html>
